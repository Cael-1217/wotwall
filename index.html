<!DOCTYPE html><html lang='zh-CN'><head><meta charset='UTF-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>坦克墙资料库</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
#top{position:sticky;top:0;background:#222;padding:10px;z-index:9}
input,select{width:100%;padding:10px;margin:4px 0;box-sizing:border-box}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#1b1b1b;border-radius:10px;padding:8px}
.card img{width:100%;height:120px;object-fit:contain}
.title{text-align:center;font-weight:bold}
#detail{display:none;position:fixed;inset:0;background:#111;z-index:99;overflow:hidden}
#back{padding:10px;background:#222}
#detail img{display:block;max-width:100%;max-height:45vh;margin:auto}
#text{height:35vh;overflow-y:auto;padding:15px;line-height:1.6}
</style></head><body>
<div id='top'>
<input id='search' placeholder='搜索坦克名称'>
<select id='filter'>
<option value=''>全部分类</option>
<option>工程车</option>
<option>反坦</option>
<option>重坦</option>
<option>中坦</option>
<option>轻坦</option>
<option>火炮</option>
</select>
</div>
<div id='grid'></div>
<div id='detail'>
<div id='back'>← 返回目录</div>
<img id='bigimg'>
<h2 id='btitle' style='text-align:center'></h2>
<div id='text'></div>
</div>
<script>
const tanks=[
{name:'EBG-62',cat:'工程车',img:'EBG-62.JPG',text:'F系VIII级工程车EBG-62'},
{name:'EBG-54',cat:'工程车',img:'EBG-54.JPG',text:'这里填写详细介绍。'},
{name:'EBG-58',cat:'工程车',img:'EBG-58.JPG',text:'这里填写详细介绍。'},
{name:'EBG-60',cat:'工程车',img:'EBG-60.JPG',text:'这里填写详细介绍。'}
];
const grid=document.getElementById('grid');
function draw(){
grid.innerHTML='';
let s=search.value.toLowerCase(),f=filter.value;
tanks.forEach(t=>{
if((!f||t.cat==f)&&t.name.toLowerCase().includes(s)){
let c=document.createElement('div');
c.className='card';
c.innerHTML=`<img src="${t.img}"><div class=title>${t.name}</div>`;
c.onclick=()=>openTank(t);
grid.appendChild(c);
}});
}
function openTank(t){
detail.style.display='block';
bigimg.src=t.img;
btitle.innerText=t.name;
text.innerText=t.text;
}
back.onclick=()=>detail.style.display='none';
search.oninput=draw;
filter.onchange=draw;
draw();
</script></body></html>
