<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坦克墙</title>
<style>
/* 基础变量定义（支持白天/夜晚模式切换） */
:root {
    --bg-color: #111;
    --text-color: #fff;
    --header-bg: #222;
    --card-text: #fff;
    --border-color: #444;
}
.light-mode {
    --bg-color: #f5f5f5;
    --text-color: #333;
    --header-bg: #e0e0e0;
    --card-text: #fff;
    --border-color: #ccc;
}

body { margin:0; background:var(--bg-color); color:var(--text-color); font-family:Arial; transition: background 0.3s, color 0.3s; }

/* 顶栏与标签页导航 */
header { position:sticky; top:0; background:var(--header-bg); padding:10px; z-index: 10; }
.tabs { display: flex; justify-content: space-around; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
.tab-btn { background: none; border: none; color: var(--text-color); font-size: 16px; font-weight: bold; padding: 6px 12px; cursor: pointer; opacity: 0.6; }
.tab-btn.active { opacity: 1; border-bottom: 2px solid #5aa9ff; }

/* 过滤选择栏 */
.filter-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.filter-bar input, .filter-bar select { width:100%; padding:8px; box-sizing:border-box; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; }
.filter-bar input { grid-column: span 2; }

/* 页面内容区块控制 */
.page-content { display: none; padding: 10px; }
.page-content.active { display: block; }

/* 坦克网格与列表布局样式 */
#grid { display:grid; gap:10px; }
/* 小图片网格模式 */
#grid.grid-mode { grid-template-columns: 1fr 1fr; }
#grid.grid-mode .card { border-radius:10px; padding:8px; cursor:pointer; text-align: center; color: var(--card-text); }
#grid.grid-mode .card img.tank-preview { width:100%; height:120px; object-fit:contain; }
#grid.grid-mode .title-container { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; margin-bottom: 4px; }

/* 网页自定义透明图标样式 */
.type-icon-png { width: 16px; height: 16px; object-fit: contain; vertical-align: middle; display: inline-block; }

/* 列表排序模式（不显示图片） */
#grid.list-mode { grid-template-columns: 1fr; }
#grid.list-mode .card { border-radius:6px; padding:12px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; color: var(--card-text); }
#grid.list-mode .card img.tank-preview { display: none; }
#grid.list-mode .title-container { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; }
#grid.list-mode .type-badge { font-size: 12px; opacity: 0.8; border: 1px solid rgba(255,255,255,0.4); padding: 2px 6px; border-radius: 4px; }

/* 各系背景色 (包含原有修改及新增) */
.FR { background: #006fb4; } /* 青色 */
.DE { background: #1a1a1a; } /* 黑色 */
.US { background: #f5f5dc; color: #000; } /* 米色 (深色字体防看不清) */
.RU { background: #005a00; } /* 深绿色 */
.CN { background: #90ee90; color: #000; } /* 浅绿色 (深色字体防看不清) */
.SE { background: linear-gradient(90deg, #005bc5, #ffcd00); text-shadow: 1px 1px 2px #000; } /* 蓝黄渐变 */
.UK { background: linear-gradient(135deg, #c8102e 0%, #c8102e 33.33%, #ffffff 33.33%, #ffffff 66.66%, #012169 66.66%, #012169 100%); text-shadow: 1px 1px 3px #000; } /* Y系 135度倾斜三色等分 */
/* Y系 红白蓝渐变 */
.PL { background: #ff8c00; } /* B系 橙色 */
.JK { background: #654321; } /* J系 棕色 */
.JP { background: #ffffff; color: #000; border: 1px solid #ccc; } /* R系 白色 */
.SP { background: linear-gradient(90deg, #ffc400, #c60b1e); text-shadow: 1px 1px 2px #000; } /* X系 黄红渐变 */
.IT { background: linear-gradient(90deg, #cd212a, #ffffff, #008c45); text-shadow: 1px 1px 3px #000; } /* I系 红白绿渐变 */


/* 详情模态页 */
#detail{display:none; position:fixed; inset:0; background:var(--bg-color); z-index: 100; overflow-y: auto;}
#back{padding:15px; background:var(--header-bg); cursor: pointer; font-weight: bold;}
#gallery{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background: #000;}
#gallery img{width:100vw; height:45vh; object-fit:contain; scroll-snap-align:start}
#desc{ height:35vh; overflow-y:auto; padding:15px; white-space:pre-wrap; border-top: 1px solid var(--border-color); }
#dtitle { padding: 0 15px; margin: 15px 0 5px 0; }

/* 作者页面卡片垂直排列容器 */
#author-card-container { display: flex; flex-direction: column; gap: 15px; }

/* 作者卡片盒 */
.author-card-box {
    background: var(--header-bg);
    border-radius: 12px;
    padding: 20px 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    color: var(--text-color);
}
.author-main { display: flex; align-items: center; gap: 15px; position: relative; }
.author-avatar { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }
.author-right { display: flex; flex-direction: column; gap: 6px; }
.author-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.author-name { font-size: 20px; font-weight: bold; }

/* 1. 原Lv区域升级为自定义头衔 */
.author-title-badge { background: #e2f0e3; color: #52a55d; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

/* 2. 原A2区域升级为作品浏览（支持点击过滤） */
.author-work-preview { font-size: 12px; background: rgba(90,169,255,0.15); color: #5aa9ff; border: 1px solid #5aa9ff; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.2s; }
.author-work-preview:active { background: rgba(90,169,255,0.3); }

.author-stats { display: flex; gap: 20px; margin-top: 12px; padding-left: 90px; }
.stat-item { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--text-color); opacity: 0.8; }
.stat-item .num { font-size: 18px; font-weight: bold; margin-bottom: 2px; opacity: 1; }
.stat-item .num.green { color: #4caf50; }
.author-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px; color: var(--text-color); opacity: 0.6; }
.lollipop-box { display: flex; align-items: center; gap: 4px; color: #e0a13c; font-weight: bold; font-size: 14px; }

/* 作者过滤动态提示横条 */
#author-filter-hint { display: none; background: rgba(90,169,255,0.15); border: 1px solid #5aa9ff; color: #5aa9ff; padding: 8px 12px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; justify-content: space-between; align-items: center; }
#author-filter-hint button { background: #5aa9ff; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

/* 设置界面布局 */
.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
.setting-item span { font-size: 16px; font-weight: bold; }
.setting-item select, .setting-item input[type="checkbox"] { padding: 6px; font-size: 14px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
.setting-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }

/* 底部跑马灯 */
#marquee{position:fixed; bottom:0; left:0; right:0; background:#000; overflow:hidden; z-index: 5; color: #fff; height: 24px; line-height: 24px; font-size: 13px;}
#marquee div{white-space:nowrap; padding-left:100%; animation:mar 15s linear infinite}
@keyframes mar{to{transform:translateX(-100%)}}
body { padding-bottom: 25px; }
/* 加载画面整体遮罩层 */
#loading-screen {
    position: fixed;
    inset: 0;
    background: #111; /* 黑色背景 */
    z-index: 9999; /* 保证它盖住页面上所有东西 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease; /* 淡出动画 */
}

/* 加载图片样式 */
#loading-image {
    width: 80%;
    max-width: 400px;
    height: auto;
    border-radius: 12px;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    object-fit: cover;
}

/* 进度条外框 */
#progress-container {
    width: 70%;
    max-width: 350px;
    height: 12px;
    background: #333;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #555;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}

/* 蓝色渐变进度条 */
#progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #5aa9ff, #005bc5);
    transition: width 0.4s ease; /* 进度条移动的平滑过渡效果 */
}

/* 状态文字 */
#loading-text {
    margin-top: 15px;
    font-size: 14px;
    color: #ccc;
    font-weight: bold;
    letter-spacing: 1px;
}

/* 工具页面输入框样式 */
#tools-page input[type="number"] {
    background: var(--bg-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    outline: none;
}

</style>
</head>

// 选项卡切换
function switchTab(pageId, btn, keepFilter = false) {
    document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(pageId).classList.add('active');
    btn.classList.add('active');
    
    if(pageId === 'tank-page') {
        filters.style.display = 'grid';
        if(!keepFilter) {
            currentAuthorFilter = "";
        }
        draw();
    } else {
        filters.style.display = 'none';
    }
}

// 图标生成逻辑
function getIconHtml(type) {
    const config = typeIcons[type];
    if (!config) return `<span style="color:#ffcd38; font-weight:bold; margin-right:4px;">•</span>`;
    return `
        <img src="${config.png}" class="type-icon-png" style="margin-right:4px;" 
             onerror="this.style.display='none'; if(this.nextElementSibling){this.nextElementSibling.style.display='inline-block';}">
        <span style="display:none; color:#ffcd38; font-weight:bold; margin-right:4px;">${config.fallback}</span>
    `;
}

// 主列表绘制逻辑
function draw(){
    if(!grid) return;
    grid.innerHTML="";
    const currentLayout = document.getElementById("layout-select") ? document.getElementById("layout-select").value : "grid";
    
    const hintBar = document.getElementById("author-filter-hint");
    const hintText = document.getElementById("filter-hint-text");
    if(currentAuthorFilter && authors[currentAuthorFilter]) {
        hintBar.style.display = "flex";
        hintText.innerText = `🔍 正在浏览 [${authors[currentAuthorFilter].name}] 的作品`;
    } else {
        hintBar.style.display = "none";
    }
    
    tanks.forEach(t=>{
        if((!nation.value||t.nation===nation.value)
        &&(!tier.value||t.tier===tier.value)
        &&(!type.value||t.type===type.value)
        &&(!currentAuthorFilter||t.authorId===currentAuthorFilter)
        &&t.name.toLowerCase().includes(search.value.toLowerCase())){
            
            let card=document.createElement("div");
            card.className="card "+t.nation;
            
            let iconHtml = getIconHtml(t.type);
            
            if(currentLayout === 'grid') {
                card.innerHTML = `
                    <div class='title-container'>${iconHtml}<span>${t.name}</span></div>
                    <img class="tank-preview" src='${t.imgs[0]}' onerror="this.src='https://via.placeholder.com/120x80?text=No+Image'">
                `;
            } else {
                card.innerHTML = `
                    <div class='title-container'>
                        ${iconHtml}
                        <span>${t.name}</span>
                    </div>
                    <span class='type-badge'>${t.tier} / ${t.type}</span>
                `;
            }
            
            card.onclick=()=>showTank(t);
            grid.appendChild(card);
        }
    });
}

// 【加载动画逻辑】
window.addEventListener('load', () => {
    const loadingScreen = document.getElementById('loading-screen');
    const progressBar = document.getElementById('progress-bar');
    const loadingText = document.getElementById('loading-text');
    const loadingImage = document.getElementById('loading-image'); // 新增：获取图片元素

    // ==========================================
    // 【新增】：多张加载图随机切换逻辑
    // 把你所有的加载图片文件名写在这个数组里（注意加引号和逗号）
    const loadingBgs = [
        "bg1.PNG",
        "bg2.JPG",
        "bg3.JPG",
        "tank_load.JPG"
    ];
    // 随机抽取一张，并替换到画面上
    const randomBg = loadingBgs[Math.floor(Math.random() * loadingBgs.length)];
    loadingImage.src = randomBg;
    // ==========================================

    // 定义加载阶段和对应的文字 (这部分和你之前的一样，保持不变即可)
    const steps = [
        { progress: 15, text: "正在连接potato2服务器..." },
        { progress: 40, text: "正在解析车辆图片与文本..." },
        { progress: 75, text: "正在获取创作者数据..." },
        { progress: 95, text: "正在渲染画面..." },
        { progress: 100, text: "加载完成！" }
    ];

    let stepIndex = 0;

    function simulateLoading() {
        if (stepIndex < steps.length) {
            // 更新进度条和文字
            progressBar.style.width = steps[stepIndex].progress + "%";
            loadingText.innerText = steps[stepIndex].text;
            stepIndex++;
            
            // 随机延迟 0.2秒 ~ 0.6秒，模拟真实的顿挫加载感
            setTimeout(simulateLoading, Math.random() * 400 + 200); 
        } else {
            // 达到 100% 后，延迟一点点再开始淡出，让玩家看清“加载完成”
            setTimeout(() => {
                loadingScreen.style.opacity = "0"; // 触发CSS淡出
                // 等待淡出动画（0.5秒）结束后，彻底移除隐藏
                setTimeout(() => {
                    loadingScreen.style.display = "none";
                }, 500);
            }, 300);
        }
    }

    // 启动加载动画
    simulateLoading();
});

// ==================== 工具：装甲计算器逻辑 ====================
function calculateArmor() {
    let act = parseFloat(document.getElementById('calc-act').value);
    let ang = parseFloat(document.getElementById('calc-ang').value);
    let eff = parseFloat(document.getElementById('calc-eff').value);

    if (!isNaN(act) && !isNaN(ang) && isNaN(eff)) {
        // 算等效: E = A / cos(角度)
        let rad = ang * Math.PI / 180;
        document.getElementById('calc-eff').value = (act / Math.cos(rad)).toFixed(2);
    } else if (!isNaN(eff) && !isNaN(ang) && isNaN(act)) {
        // 算实际: A = E * cos(角度)
        let rad = ang * Math.PI / 180;
        document.getElementById('calc-act').value = (eff * Math.cos(rad)).toFixed(2);
    } else if (!isNaN(act) && !isNaN(eff) && isNaN(ang)) {
        // 算角度: 角度 = arccos(A / E)
        if (act > eff) { alert("物理常识错误：实际厚度不能大于等效厚度！"); return; }
        let rad = Math.acos(act / eff);
        document.getElementById('calc-ang').value = (rad * 180 / Math.PI).toFixed(2);
    } else {
        alert("请正确填写：必须且只能填写其中的两项数值！");
    }
}

function clearCalc() {
    document.getElementById('calc-act').value = '';
    document.getElementById('calc-ang').value = '';
    document.getElementById('calc-eff').value = '';
}

// ==================== 小游戏：2D 跑酷逻辑 ===================
let gameLoop, ctx, canvas;
let player = { lane: 1, img: new Image() }; // lane: 0=上, 1=中, 2=下
player.img.src = "player.PNG"; // 这里填你的主角图片名字！
let obstacles = [], gameSpeed = 5, score = 0, frames = 0, isGameOver = false;

async function enterFullscreenGame() {
    const container = document.getElementById('game-container');
    container.style.display = 'flex';
    // 尝试进入全屏并强制横屏 (需要浏览器支持)
    if (container.requestFullscreen) {
        try { await container.requestFullscreen(); } catch (e) {}
    }
    if (screen.orientation && screen.orientation.lock) {
        try { await screen.orientation.lock('landscape'); } catch (e) {}
    }
    initGame();
}

async function exitFullscreenGame() {
    isGameOver = true;
    document.getElementById('game-container').style.display = 'none';
    if (document.fullscreenElement) { await document.exitFullscreen(); }
    if (screen.orientation && screen.orientation.unlock) { screen.orientation.unlock(); }
}

function initGame() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    player.lane = 1;
    obstacles = [];
    gameSpeed = 6;
    score = 0;
    frames = 0;
    isGameOver = false;
    document.getElementById('game-score').innerText = 0;
    runGame();
}

function runGame() {
    if (isGameOver) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 绘制三条车道线
    ctx.strokeStyle = "rgba(255,255,255,0.2)";
    ctx.lineWidth = 4;
    ctx.setLineDash([20, 20]);
    ctx.beginPath(); ctx.moveTo(0, 133); ctx.lineTo(800, 133); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 266); ctx.lineTo(800, 266); ctx.stroke();
    ctx.setLineDash([]);

    // ==========================================
    // 【终极提速与计分逻辑】
    // ==========================================
    frames++;
    
    // 1. 分数增长：随速度越快，跳分越猛
    let scoreInterval = Math.max(1, Math.floor(150 / gameSpeed)); 
    if (frames % scoreInterval === 0) {
        score++; 
        document.getElementById('game-score').innerText = score; 
    }

    // 2. 疯狂提速：每 200 帧（约 3 秒）提升 0.8 速度
    if (frames % 200 === 0) { 
        gameSpeed += 0.8; 
    } 

    // 3. 障碍生成：速度越快，刷得越密（概率动态调整）
    let spawnInterval = Math.max(25, Math.floor(120 - gameSpeed * 6));
    if (frames % spawnInterval === 0) {
        let lane1 = Math.floor(Math.random() * 3);
        let lane2 = Math.floor(Math.random() * 3);
        obstacles.push({ x: 800, lane: lane1 });
        
        // 游戏后期（速度>10），双排障碍概率提升到 75%
        let doubleObsChance = gameSpeed > 10 ? 0.75 : 0.5;
        if(Math.random() > (1 - doubleObsChance) && lane1 !== lane2) { 
            obstacles.push({ x: 800, lane: lane2 }); 
        }
    }

    // 移动与绘制障碍物
    for (let i = 0; i < obstacles.length; i++) {
        let obs = obstacles[i];
        
        // 【核心优化】：使用 Math.round 对齐整数像素，强制消除抖动
        obs.x -= Math.round(gameSpeed); 
        
        ctx.fillStyle = "#ff4757";
        // 确保坐标也是整数
        ctx.fillRect(Math.round(obs.x), 30 + obs.lane * 133, 60, 60);

        // 碰撞检测逻辑保持不变
        if (obs.x < 110 && obs.x + 60 > 50 && obs.lane === player.lane) {
            isGameOver = true;
            ctx.fillStyle = "rgba(0,0,0,0.7)"; ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = "#fff"; ctx.font = "40px Arial"; ctx.fillText("游戏结束! 分数: " + score, 250, 200);
            ctx.font = "20px Arial"; ctx.fillText("点击屏幕重试", 330, 250);
        }
    }
    obstacles = obstacles.filter(obs => obs.x > -60);
    // ==========================================

  //  这是专为你 1167x455 尺寸优化的长方形代码：
let playerY = 30 + player.lane * 133;
if (player.img.complete && player.img.naturalHeight !== 0) {
    // 保持 1167:455 的比例，设定高度为 40 像素，宽度按比例自动算出约为 102 像素
    let pHeight = 40; 
    let pWidth = (1167 / 455) * pHeight; // 自动计算完美比例
    
    // 稍微调整一下 Y 轴偏置，让它在赛道中间
    ctx.drawImage(player.img, 50, playerY + 10, pWidth, pHeight); 
} else {
    ctx.fillStyle = "#5aa9ff"; ctx.fillRect(50, playerY + 10, 102, 40); // 备用方块也变成长方形
}

    if (!isGameOver) requestAnimationFrame(runGame);
}

// 监听游戏点击/滑动控制 (点击上半屏往上走，下半屏往下走)
document.getElementById('game-container').addEventListener('mousedown', (e) => {
    if(isGameOver) { initGame(); return; } // 重开
    if (e.target.tagName === "BUTTON") return; // 防止误触退出按钮
    let rect = canvas.getBoundingClientRect();
    let clickY = e.clientY - rect.top;
    if (clickY < rect.height / 2 && player.lane > 0) player.lane--;
    else if (clickY >= rect.height / 2 && player.lane < 2) player.lane++;
});
