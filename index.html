<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坦克墙</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
/* 基础变量定义（支持白天/夜晚模式切换） */
:root {
    --bg-color: #111;
    --text-color: #fff;
    --header-bg: #222;
    --card-text: #fff;
    --border-color: #444;
}
.light-mode {
    --bg-color: #f5f5f5;
    --text-color: #333;
    --header-bg: #e0e0e0;
    --card-text: #fff;
    --border-color: #ccc;
}

body {
    margin:0; background:var(--bg-color); color:var(--text-color);
    font-family:Arial; transition: background 0.3s, color 0.3s;
    -webkit-user-select: none; user-select: none;
}

/* 顶栏与标签页导航 */
header { position:sticky; top:0; background:var(--header-bg); padding:10px; z-index: 10; }
.tabs { display: flex; justify-content: space-around; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
.tab-btn { background: none; border: none; color: var(--text-color); font-size: 16px; font-weight: bold; padding: 6px 12px; cursor: pointer; opacity: 0.6; }
.tab-btn.active { opacity: 1; border-bottom: 2px solid #5aa9ff; }

/* 过滤选择栏 */
.filter-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.filter-bar input, .filter-bar select { width:100%; padding:8px; box-sizing:border-box; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; }
.filter-bar input { grid-column: span 2; }

/* 页面内容区块控制 */
.page-content { display: none; padding: 10px; }
.page-content.active { display: block; }

/* 坦克网格与列表布局样式 */
#grid { display:grid; gap:10px; }
#grid.grid-mode { grid-template-columns: 1fr 1fr; }
#grid.grid-mode .card { border-radius:10px; padding:8px; cursor:pointer; text-align: center; color: var(--card-text); }
#grid.grid-mode .card img.tank-preview { width:100%; height:120px; object-fit:contain; }
#grid.grid-mode .title-container { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; margin-bottom: 4px; }

.type-icon-png { width: 16px; height: 16px; object-fit: contain; vertical-align: middle; display: inline-block; }

#grid.list-mode { grid-template-columns: 1fr; }
#grid.list-mode .card { border-radius:6px; padding:12px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; color: var(--card-text); }
#grid.list-mode .card img.tank-preview { display: none; }
#grid.list-mode .title-container { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; }
#grid.list-mode .type-badge { font-size: 12px; opacity: 0.8; border: 1px solid rgba(255,255,255,0.4); padding: 2px 6px; border-radius: 4px; }

/* 各系背景色 */
.FR { background: #006fb4; }
.DE { background: #1a1a1a; }
.US { background: #f5f5dc; color: #000; }
.RU { background: #005a00; }
.CN { background: #90ee90; color: #000; }
.SE { background: linear-gradient(90deg, #005bc5, #ffcd00); text-shadow: 1px 1px 2px #000; }
.UK { background: linear-gradient(135deg, #c8102e 0%, #c8102e 33.33%, #ffffff 33.33%, #ffffff 66.66%, #012169 66.66%, #012169 100%); text-shadow: 1px 1px 3px #000; }
.PL { background: #ff8c00; }
.JK { background: #654321; }
.JP { background: #ffffff; color: #000; border: 1px solid #ccc; }
.SP { background: linear-gradient(90deg, #ffc400, #c60b1e); text-shadow: 1px 1px 2px #000; }
.IT { background: linear-gradient(90deg, #cd212a, #ffffff, #008c45); text-shadow: 1px 1px 3px #000; }

/* 详情模态页 */
#detail{display:none; position:fixed; inset:0; background:var(--bg-color); z-index: 100; overflow-y: auto;}
#back{padding:15px; background:var(--header-bg); cursor: pointer; font-weight: bold;}
#gallery{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background: #000;}
#gallery img{width:100vw; height:45vh; object-fit:contain; scroll-snap-align:start}
#desc{ height:35vh; overflow-y:auto; padding:15px; white-space:pre-wrap; border-top: 1px solid var(--border-color); }
#dtitle { padding: 0 15px; margin: 15px 0 5px 0; }

/* 作者页面卡片垂直排列容器 */
#author-card-container { display: flex; flex-direction: column; gap: 15px; }

/* 作者卡片盒 */
.author-card-box {
    background: var(--header-bg);
    border-radius: 12px;
    padding: 20px 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    color: var(--text-color);
}
.author-main { display: flex; align-items: center; gap: 15px; position: relative; }
.author-avatar { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }
.author-right { display: flex; flex-direction: column; gap: 6px; }
.author-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.author-name { font-size: 20px; font-weight: bold; }

.author-title-badge { background: #e2f0e3; color: #52a55d; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }

.author-work-preview { font-size: 12px; background: rgba(90,169,255,0.15); color: #5aa9ff; border: 1px solid #5aa9ff; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; cursor: pointer; transition: background 0.2s; }
.author-work-preview:active { background: rgba(90,169,255,0.3); }

.author-stats { display: flex; gap: 20px; margin-top: 12px; padding-left: 90px; }
.stat-item { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--text-color); opacity: 0.8; }
.stat-item .num { font-size: 18px; font-weight: bold; margin-bottom: 2px; opacity: 1; }
.stat-item .num.green { color: #4caf50; }
.author-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px; color: var(--text-color); opacity: 0.6; }
.lollipop-box { display: flex; align-items: center; gap: 4px; color: #e0a13c; font-weight: bold; font-size: 14px; }

/* 作者过滤动态提示横条 */
#author-filter-hint { display: none; background: rgba(90,169,255,0.15); border: 1px solid #5aa9ff; color: #5aa9ff; padding: 8px 12px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; font-weight: bold; justify-content: space-between; align-items: center; }
#author-filter-hint button { background: #5aa9ff; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }

/* 设置界面布局 */
.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
.setting-item span { font-size: 16px; font-weight: bold; }
.setting-item select, .setting-item input[type="checkbox"] { padding: 6px; font-size: 14px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
.setting-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }

/* 底部跑马灯 */
#marquee{position:fixed; bottom:0; left:0; right:0; background:#000; overflow:hidden; z-index: 5; color: #fff; height: 24px; line-height: 24px; font-size: 13px;}
#marquee div{white-space:nowrap; padding-left:100%; animation:mar 15s linear infinite}
@keyframes mar{to{transform:translateX(-100%)}}
body { padding-bottom: 25px; }

/* 加载画面 */
#loading-screen {
    position: fixed;
    inset: 0;
    background: #111;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: opacity 0.5s ease;
}
#loading-image {
    width: 80%;
    max-width: 400px;
    height: auto;
    border-radius: 12px;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    object-fit: cover;
}
#progress-container {
    width: 70%;
    max-width: 350px;
    height: 12px;
    background: #333;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid #555;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
}
#progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #5aa9ff, #005bc5);
    transition: width 0.4s ease;
}
#loading-text {
    margin-top: 15px;
    font-size: 14px;
    color: #ccc;
    font-weight: bold;
    letter-spacing: 1px;
}

/* 工具页面输入框样式 */
#tools-page input[type="number"] {
    background: var(--bg-color);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    outline: none;
}

/* 登录卡片 */
.login-card{background:var(--header-bg);border-radius:12px;padding:20px;margin-top:15px;}
.login-title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px;}
.login-input{width:100%;box-sizing:border-box;padding:12px;margin-bottom:12px;border:none;border-radius:8px;background:var(--bg-color);color:var(--text-color);border:1px solid var(--border-color);font-size:15px;}
.login-btn-box{display:flex;gap:10px;}
.login-btn{flex:1;padding:12px;border:none;border-radius:8px;background:#5aa9ff;color:#fff;font-size:15px;font-weight:bold;cursor:pointer;}
.login-btn:active{opacity:0.8;}
.user-panel{display:none;}
.user-avatar{width:80px;height:80px;border-radius:50%;display:block;margin:auto;border:3px solid #5aa9ff;object-fit:cover;}
.user-name{text-align:center;margin-top:10px;font-size:22px;font-weight:bold;}
.user-role{text-align:center;margin-top:5px;color:#5aa9ff;font-size:14px;}
.user-menu{margin-top:20px;}
.user-menu button{width:100%;padding:12px;margin-bottom:10px;border:none;border-radius:8px;background:var(--bg-color);color:var(--text-color);border:1px solid var(--border-color);cursor:pointer;}

/* ========== 运势抽卡样式 ========== */
#fortune-overlay {
    position: fixed; inset: 0; background: #111; z-index: 10000;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
}
#fortune-animation { position: absolute; inset: 0; pointer-events: none; }
.white-bar {
    position: absolute; width: 120%; height: 4px; background: rgba(255,255,255,0.8);
    left: -10%; transform: rotate(-30deg);
    animation: barFall 0.6s linear forwards;
}
@keyframes barFall {
    0% { top: -10%; opacity: 0; }
    10% { opacity: 1; }
    100% { top: 110%; opacity: 0.2; }
}
.color-stripe {
    position: absolute;
    top: 50%; left: 50%; width: 300px; height: 60px;
    transform: translate(-50%, -50%) scale(0.5);
    border-radius: 8px;
    animation: stripeReveal 1.5s ease forwards;
}
@keyframes stripeReveal {
    0% { transform: translate(-50%, -50%) scale(0.5) rotate(0deg); opacity: 0; }
    20% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; }
    50% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(15) rotate(90deg); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(20) rotate(90deg); opacity: 0; }
}
#fortune-card {
    position: relative; width: 90%; max-width: 380px; background: #2a2a2a;
    border-radius: 16px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    color: #fff; display: none; z-index: 2; overflow: hidden;
}
#fortune-card .corner-grade {
    position: absolute; top: -10px; right: -10px; width: 80px; height: 80px;
    background: linear-gradient(135deg, var(--grade-color) 0%, transparent 70%);
    border-radius: 0 16px 0 0; opacity: 0.9;
}
#fortune-card .watermark {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(-30deg,
        rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 40px,
        transparent 40px, transparent 80px);
    pointer-events: none; z-index: 1;
}
#fortune-card .watermark-text {
    position: absolute; inset: 0; z-index: 1; overflow: hidden; pointer-events: none;
    display: flex; flex-wrap: wrap; align-content: center; justify-content: center;
    opacity: 0.05; font-size: 14px; font-weight: bold; transform: rotate(-20deg);
}
#fortune-card > *:not(.corner-grade):not(.watermark):not(.watermark-text) { position: relative; z-index: 2; }
#fortune-card img { width: 100%; height: 160px; object-fit: contain; border-radius: 8px; margin: 15px 0; -webkit-user-drag: none; pointer-events: none; }
#fortune-card .tank-name { font-size: 22px; font-weight: bold; text-align: center; }
#fortune-card .fortune-text { margin-top: 10px; font-size: 14px; line-height: 1.6; white-space: pre-line; }
#fortune-card .fortune-buttons { display: flex; gap: 10px; margin-top: 20px; }
#fortune-card .fortune-buttons button { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.btn-detail { background: #5aa9ff; color: #fff; }
.btn-share { background: #ff8c00; color: #fff; }
#fortune-close { position: absolute; top: 15px; left: 15px; z-index: 3; background: rgba(255,255,255,0.1); border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 5px 10px; border-radius: 6px; }

/* 塔防游戏额外样式 */
#td-overlay { display:none; position:fixed; inset:0; background:#1a1a1a; z-index:10002; flex-direction:column; }
.td-card { cursor:grab; user-select:none; transition:0.2s; }
.td-card:active { opacity:0.7; }
</style>

<script>
// ============ 所有原有代码（用户系统、坦克数据、工具、运势、你说我猜、动画等）保持原样 ============
// 此处省略，实际包含前文完整脚本内容

// ==================== 无尽防线塔防游戏 ====================
let tdCanvas, tdCtx, tdRunning = false;
let tdHP = 20, tdKills = 0, tdWave = 1, tdPrepareTime = 15;
let tdTowers = [];          // 部署的塔 { row, x, y, tank, stats, ... }
let tdEnemies = [];
let tdFrameId = null;
let tdEnemySpawnTimer = 0;
let tdBossCountdown = 25;   // 每击杀25小怪出一只boss
let tdBossActive = false;
let tdGameOver = false;
let tdPreparing = true;
const tdRows = 5;
let tdRowHeight = 0;
let tdCanvasWidth = 0, tdCanvasHeight = 0;
const tdBaseX = 50;         // 防线x坐标
const tdTowerX = 120;       // 塔的x坐标
let tdCardBar = null;

// 图片缓存
const imgCache = {};
function getCachedImage(src) {
    if (!imgCache[src]) {
        imgCache[src] = new Image();
        imgCache[src].src = src;
    }
    return imgCache[src];
}

function getTowerStats(tank) {
    // SAL V2 激光
    if (tank.name === 'SAL V2') {
        return {
            atk: 8,
            interval: 0,
            mode: 'laser',
            chargeTime: 3,
            fireDuration: 8,
            cooldown: 10,
            special: '真伤激光，蓄力3s→连射8s→冷却10s'
        };
    }
    let atk, interval, mode, clip = 0, shortReload = 0, longReload = 0, special = '';
    const tierNum = parseInt(tank.tier) || 8;
    const baseMul = 1 + (tierNum - 1) * 0.1;
    switch (tank.type) {
        case '重坦': atk = 25 * baseMul; interval = 1.6; mode = '单发循环'; break;
        case '中坦': atk = 18 * baseMul; interval = 1.2; mode = '弹夹'; clip = 3; shortReload = 0.3; longReload = 3.0; break;
        case '轻坦': atk = 12 * baseMul; interval = 0.8; mode = '单发循环'; break;
        case '反坦': atk = 35 * baseMul; interval = 2.2; mode = '单发循环'; break;
        case '火炮': atk = 30 * baseMul; interval = 3.0; mode = '单发循环'; break;
        case '工程车': atk = 5 * baseMul; interval = 2.5; mode = '辅助'; special = '邻行攻击+25%'; break;
        default: atk = 15 * baseMul; interval = 1.5; mode = '单发循环';
    }
    return { atk: Math.round(atk), interval, mode, clip, shortReload, longReload, special };
}

function buildCardBar() {
    tdCardBar.innerHTML = '';
    const tip = document.createElement('div');
    tip.style.cssText = 'color:#aaa;font-size:11px;min-width:50px;text-align:center;';
    tip.textContent = '拖动坦克到战场';
    tdCardBar.appendChild(tip);
    tanks.forEach((tank, index) => {
        const stats = getTowerStats(tank);
        const card = document.createElement('div');
        card.className = 'td-card';
        card.draggable = true;
        card.dataset.index = index;
        card.style.cssText = `background:var(--header-bg); border-radius:8px; padding:6px 8px; min-width:90px; cursor:grab; text-align:center; color:var(--text-color); border:1px solid var(--border-color);`;
        card.innerHTML = `
            <div style="font-weight:bold;font-size:13px;">${tank.name}</div>
            <div style="font-size:10px;">${tank.type} Lv.${tank.tier}</div>
            <div style="font-size:10px;">⚔️${stats.atk} | 🕒${stats.mode === 'laser' ? '激光' : stats.interval+'s'}</div>
            <div style="font-size:9px; color:#5aa9ff;">${stats.mode}${stats.special ? ' | '+stats.special : ''}</div>
        `;
        card.addEventListener('click', (e) => { if (!tdDragging) showTank(tank); });
        card.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', index); card.style.opacity = '0.5'; });
        card.addEventListener('dragend', (e) => { card.style.opacity = '1'; });
        tdCardBar.appendChild(card);
    });
}

function openTowerDefense() {
    const overlay = document.getElementById('td-overlay');
    overlay.style.display = 'flex';
    tdCanvas = document.getElementById('td-canvas');
    tdCtx = tdCanvas.getContext('2d');
    tdCardBar = document.getElementById('td-card-bar');
    resizeCanvas();
    buildCardBar();
    resetGame();
    const container = document.getElementById('td-canvas-container');
    container.ondragover = (e) => e.preventDefault();
    container.ondrop = (e) => {
        e.preventDefault();
        const index = e.dataTransfer.getData('text/plain');
        if (index === '') return;
        const tank = tanks[parseInt(index)];
        const rect = tdCanvas.getBoundingClientRect();
        const y = e.clientY - rect.top;
        const row = Math.floor(y / tdRowHeight);
        if (row >= 0 && row < tdRows) {
            // 如果该行已有塔，替换
            if (tdTowers.find(t => t.row === row)) return;
            placeTower(row, tank);
        }
    };
    // 已部署塔的拖动（换位/回收）
    tdCanvas.onmousedown = onCanvasMouseDown;
    tdCanvas.onmousemove = onCanvasMouseMove;
    tdCanvas.onmouseup = onCanvasMouseUp;
    tdCanvas.ontouchstart = onCanvasTouchStart;
    tdCanvas.ontouchmove = onCanvasTouchMove;
    tdCanvas.ontouchend = onCanvasTouchEnd;
    startPrepare();
}

function closeTowerDefense() {
    tdRunning = false;
    cancelAnimationFrame(tdFrameId);
    clearInterval(tdPrepareInterval);
    document.getElementById('td-overlay').style.display = 'none';
}

function resizeCanvas() {
    const container = document.getElementById('td-canvas-container');
    tdCanvas.width = container.clientWidth;
    tdCanvas.height = container.clientHeight;
    tdCanvasWidth = tdCanvas.width;
    tdCanvasHeight = tdCanvas.height;
    tdRowHeight = tdCanvasHeight / tdRows;
}

function resetGame() {
    tdHP = 20; tdKills = 0; tdWave = 1;
    tdTowers = []; tdEnemies = [];
    tdGameOver = false; tdBossActive = false;
    tdBossCountdown = 25; tdEnemySpawnTimer = 0;
    updateStats();
}

function startPrepare() {
    tdPreparing = true; tdPrepareTime = 15;
    document.getElementById('td-timer').textContent = tdPrepareTime + 's';
    tdPrepareInterval = setInterval(() => {
        tdPrepareTime--;
        document.getElementById('td-timer').textContent = tdPrepareTime + 's';
        if (tdPrepareTime <= 0) {
            clearInterval(tdPrepareInterval);
            tdPreparing = false;
            document.getElementById('td-timer').textContent = '战斗中';
            tdRunning = true;
            tdFrameId = requestAnimationFrame(gameLoop);
        }
    }, 1000);
}

function placeTower(row, tank) {
    const stats = getTowerStats(tank);
    tdTowers.push({
        row: row,
        x: tdTowerX,
        y: row * tdRowHeight + tdRowHeight/2,
        tank: tank,
        stats: stats,
        attackTimer: 0,
        clipAmmo: stats.clip || 0,
        reloadTimer: 0,
        laserState: 'idle', // idle, charging, firing, cooldown
        laserTimer: 0
    });
}

// 工程车加成
function getRowAtk(row) {
    const tower = tdTowers.find(t => t.row === row);
    if (!tower) return 0;
    let bonus = 0;
    tdTowers.forEach(t => {
        if (t.tank.type === '工程车' && (t.row === row - 1 || t.row === row + 1)) {
            bonus += 0.25;
        }
    });
    return Math.round(tower.stats.atk * (1 + bonus));
}

function spawnEnemy(row, isBoss = false) {
    const baseHP = 15 + tdWave * 5;
    const hp = isBoss ? baseHP * 20 : baseHP;
    const speed = isBoss ? 0.5 : 1 + tdWave * 0.15;
    const damage = isBoss ? 5 : 1;
    tdEnemies.push({
        row: row,
        x: tdCanvasWidth,
        y: row * tdRowHeight + tdRowHeight/2,
        hp: hp,
        maxHp: hp,
        speed: speed,
        damage: damage,
        isBoss: isBoss,
        size: isBoss ? 25 : 15
    });
}

function updateStats() {
    document.getElementById('td-hp').textContent = tdHP;
    document.getElementById('td-wave').textContent = tdWave;
    document.getElementById('td-kills').textContent = tdKills;
}

// 游戏主循环
function gameLoop() {
    if (!tdRunning || tdGameOver) return;
    tdCtx.clearRect(0, 0, tdCanvasWidth, tdCanvasHeight);
    drawBackground();
    updateEnemies();
    updateTowers();
    drawTowers();
    drawEnemies();
    checkGameOver();
    if (!tdGameOver) tdFrameId = requestAnimationFrame(gameLoop);
}

function drawBackground() {
    tdCtx.fillStyle = '#ff4444';
    tdCtx.fillRect(tdBaseX - 4, 0, 8, tdCanvasHeight);
    tdCtx.strokeStyle = 'rgba(255,255,255,0.1)';
    for (let i = 1; i < tdRows; i++) {
        tdCtx.beginPath();
        tdCtx.moveTo(0, i * tdRowHeight);
        tdCtx.lineTo(tdCanvasWidth, i * tdRowHeight);
        tdCtx.stroke();
    }
}

function updateEnemies() {
    if (!tdBossActive) {
        tdEnemySpawnTimer--;
        if (tdEnemySpawnTimer <= 0) {
            const rowsToSpawn = Math.min(tdWave, tdRows);
            for (let i = 0; i < rowsToSpawn; i++) spawnEnemy(i, false);
            tdEnemySpawnTimer = Math.max(30, 80 - tdWave * 3);
        }
        if (tdKills >= tdWave * tdBossCountdown && !tdBossActive) {
            tdBossActive = true;
            const bossRow = Math.floor(Math.random() * tdRows);
            spawnEnemy(bossRow, true);
            document.getElementById('td-timer').textContent = '⚠️ BOSS!';
        }
    }
    for (let i = tdEnemies.length - 1; i >= 0; i--) {
        const e = tdEnemies[i];
        e.x -= e.speed;
        if (e.x <= tdBaseX) {
            tdHP -= e.damage;
            updateStats();
            tdEnemies.splice(i, 1);
            if (e.isBoss) { tdBossActive = false; tdBossCountdown += 5; }
            continue;
        }
        if (e.hp <= 0) {
            tdKills++;
            if (e.isBoss) {
                tdBossActive = false;
                tdBossCountdown = 25 + tdWave * 5;
                document.getElementById('td-timer').textContent = '战斗中';
            }
            tdEnemies.splice(i, 1);
        }
    }
    if (tdKills >= tdWave * 15) {
        tdWave++;
        tdBossCountdown = 25 + tdWave * 2;
    }
    updateStats();
}

function updateTowers() {
    tdTowers.forEach(t => {
        const stats = t.stats;
        // 激光模式
        if (stats.mode === 'laser') {
            switch (t.laserState) {
                case 'idle':
                    t.laserState = 'charging';
                    t.laserTimer = stats.chargeTime;
                    break;
                case 'charging':
                    t.laserTimer -= 1/60;
                    if (t.laserTimer <= 0) {
                        t.laserState = 'firing';
                        t.laserTimer = stats.fireDuration;
                    }
                    break;
                case 'firing':
                    // 每帧伤害
                    if (tdBossActive) {
                        const boss = tdEnemies.find(e => e.isBoss);
                        if (boss) boss.hp -= stats.atk / 60;
                    } else {
                        const enemy = tdEnemies.find(e => e.row === t.row && e.x > tdBaseX);
                        if (enemy) enemy.hp -= stats.atk / 60;
                    }
                    t.laserTimer -= 1/60;
                    if (t.laserTimer <= 0) {
                        t.laserState = 'cooldown';
                        t.laserTimer = stats.cooldown;
                    }
                    break;
                case 'cooldown':
                    t.laserTimer -= 1/60;
                    if (t.laserTimer <= 0) t.laserState = 'idle';
                    break;
            }
            return;
        }
        // 弹夹模式
        if (stats.mode === '弹夹') {
            if (t.reloadTimer > 0) { t.reloadTimer -= 1/60; return; }
            if (t.clipAmmo <= 0) {
                t.reloadTimer = stats.longReload;
                t.clipAmmo = stats.clip;
                return;
            }
        }
        // 攻击计时
        t.attackTimer -= 1/60;
        if (t.attackTimer <= 0) {
            let target = null;
            if (tdBossActive) target = tdEnemies.find(e => e.isBoss);
            if (!target) target = tdEnemies.find(e => e.row === t.row && e.x > tdBaseX);
            if (target) {
                const atk = getRowAtk(t.row);
                target.hp -= atk;
                t.attackTimer = stats.interval;
                if (stats.mode === '弹夹') {
                    t.clipAmmo--;
                    t.attackTimer = stats.shortReload;
                }
            }
        }
    });
}

function drawTowers() {
    tdTowers.forEach(t => {
        const x = t.x, y = t.y;
        let imgSrc = t.tank.imgs[0];
        if (t.stats.mode === 'laser' && t.laserState === 'firing') {
            imgSrc = t.tank.fireImg || t.tank.imgs[0];
        }
        const img = getCachedImage(imgSrc);
        if (img.complete && img.naturalWidth > 0) {
            tdCtx.drawImage(img, x - 20, y - 20, 40, 40);
        } else {
            tdCtx.fillStyle = '#5aa9ff';
            tdCtx.fillRect(x - 15, y - 15, 30, 30);
        }
        // 状态文字
        tdCtx.fillStyle = '#fff';
        tdCtx.font = '9px Arial';
        tdCtx.textAlign = 'center';
        if (t.stats.mode === 'laser') {
            let text = t.laserState === 'charging' ? '⚡' : t.laserState === 'firing' ? '🔥' : '⏳';
            tdCtx.fillText(text, x, y - 18);
        } else if (t.stats.mode === '弹夹' && t.reloadTimer > 0) {
            tdCtx.fillText('装填中', x, y - 18);
        }
    });
}

function drawEnemies() {
    tdEnemies.forEach(e => {
        const s = e.size;
        tdCtx.fillStyle = e.isBoss ? '#ff0000' : '#ff8c00';
        tdCtx.fillRect(e.x - s, e.y - s, s*2, s*2);
        if (e.hp < e.maxHp) {
            tdCtx.fillStyle = '#333';
            tdCtx.fillRect(e.x - s, e.y - s - 8, s*2, 4);
            tdCtx.fillStyle = '#0f0';
            tdCtx.fillRect(e.x - s, e.y - s - 8, s*2 * (e.hp/e.maxHp), 4);
        }
    });
}

function checkGameOver() {
    if (tdHP <= 0) {
        tdGameOver = true;
        tdRunning = false;
        document.getElementById('td-timer').textContent = '防线失守';
        tdCtx.fillStyle = 'rgba(0,0,0,0.7)';
        tdCtx.fillRect(0, 0, tdCanvasWidth, tdCanvasHeight);
        tdCtx.fillStyle = '#fff';
        tdCtx.font = '30px Arial';
        tdCtx.textAlign = 'center';
        tdCtx.fillText('游戏结束！坚持了 ' + tdWave + ' 波', tdCanvasWidth/2, tdCanvasHeight/2);
    }
}

// 拖拽已部署的塔（换位/回收）
let dragTower = null;
let dragStartRow = null;
function onCanvasMouseDown(e) { handleDragStart(e.clientX, e.clientY); }
function onCanvasMouseMove(e) { handleDragMove(e.clientX, e.clientY); }
function onCanvasMouseUp(e) { handleDragEnd(e.clientX, e.clientY); }
function onCanvasTouchStart(e) { const t = e.touches[0]; handleDragStart(t.clientX, t.clientY); }
function onCanvasTouchMove(e) { const t = e.touches[0]; handleDragMove(t.clientX, t.clientY); }
function onCanvasTouchEnd(e) { handleDragEnd(0,0); }

function handleDragStart(cx, cy) {
    const rect = tdCanvas.getBoundingClientRect();
    const x = cx - rect.left, y = cy - rect.top;
    for (let t of tdTowers) {
        if (Math.abs(x - t.x) < 25 && Math.abs(y - t.y) < 25) {
            dragTower = t;
            dragStartRow = t.row;
            break;
        }
    }
}
function handleDragMove(cx, cy) {
    if (!dragTower) return;
    const rect = tdCanvas.getBoundingClientRect();
    const y = cy - rect.top;
    const row = Math.max(0, Math.min(tdRows-1, Math.floor(y / tdRowHeight)));
    dragTower.row = row;
    dragTower.y = row * tdRowHeight + tdRowHeight/2;
}
function handleDragEnd(cx, cy) {
    if (!dragTower) return;
    // 检查是否拖到底部卡牌栏（回收）
    const cardBar = document.getElementById('td-card-bar');
    const barRect = cardBar.getBoundingClientRect();
    if (cy && cy > barRect.top) {
        // 回收
        tdTowers = tdTowers.filter(t => t !== dragTower);
    } else {
        // 检查目标行是否有其他塔
        const conflict = tdTowers.find(t => t !== dragTower && t.row === dragTower.row);
        if (conflict) {
            // 交换位置
            conflict.row = dragStartRow;
            conflict.y = dragStartRow * tdRowHeight + tdRowHeight/2;
        }
    }
    dragTower = null;
    dragStartRow = null;
}

// 初始化塔防设置（在load后）
window.addEventListener('load', () => {
    // 给SAL V2补充fireImg
    const sal = tanks.find(t => t.name === 'SAL V2');
    if (sal && !sal.fireImg) sal.fireImg = 'SALV2_fire.PNG';
});
</script>
