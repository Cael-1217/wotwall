<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坦克墙</title>
<style>
/* 基础变量定义（支持白天/夜晚模式切换） */
:root {
    --bg-color: #111;
    --text-color: #fff;
    --header-bg: #222;
    --card-text: #fff;
    --border-color: #444;
}
.light-mode {
    --bg-color: #f5f5f5;
    --text-color: #333;
    --header-bg: #e0e0e0;
    --card-text: #fff;
    --border-color: #ccc;
}

body { margin:0; background:var(--bg-color); color:var(--text-color); font-family:Arial; transition: background 0.3s, color 0.3s; }

/* 顶栏与标签页导航 */
header { position:sticky; top:0; background:var(--header-bg); padding:10px; z-index: 10; }
.tabs { display: flex; justify-content: space-around; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
.tab-btn { background: none; border: none; color: var(--text-color); font-size: 16px; font-weight: bold; padding: 6px 12px; cursor: pointer; opacity: 0.6; }
.tab-btn.active { opacity: 1; border-bottom: 2px solid #5aa9ff; }

/* 过滤选择栏 */
.filter-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
.filter-bar input, .filter-bar select { width:100%; padding:8px; box-sizing:border-box; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; }
.filter-bar input { grid-column: span 2; }

/* 页面内容区块控制 */
.page-content { display: none; padding: 10px; }
.page-content.active { display: block; }

/* 坦克网格与列表布局样式 */
#grid { display:grid; gap:10px; }
/* 小图片网格模式 */
#grid.grid-mode { grid-template-columns: 1fr 1fr; }
#grid.grid-mode .card { border-radius:10px; padding:8px; cursor:pointer; text-align: center; color: var(--card-text); }
#grid.grid-mode .card img.tank-preview { width:100%; height:120px; object-fit:contain; }
#grid.grid-mode .title-container { display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: bold; margin-bottom: 4px; }
/* 网格自定义PNG图标样式 */
.type-icon-png { width: 16px; height: 16px; object-fit: contain; vertical-align: middle; }

/* 列表排序模式（不显示图片） */
#grid.list-mode { grid-template-columns: 1fr; }
#grid.list-mode .card { border-radius:6px; padding:12px 16px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; color: var(--card-text); }
#grid.list-mode .card img.tank-preview { display: none; }
#grid.list-mode .title-container { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 16px; }
#grid.list-mode .type-badge { font-size: 12px; opacity: 0.8; border: 1px solid rgba(255,255,255,0.4); padding: 2px 6px; border-radius: 4px; }

/* 各系背景色 */
.FR{background:#244} .DE{background:#444} .US{background:#243} .RU{background:#422} .CN{background:#664}
.SE{background:linear-gradient(90deg,#146,#db3)}

/* 详情模态页 */
#detail{display:none; position:fixed; inset:0; background:var(--bg-color); z-index: 100; overflow-y: auto;}
#back{padding:15px; background:var(--header-bg); cursor: pointer; font-weight: bold;}
#gallery{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; background: #000;}
#gallery img{width:100vw; height:45vh; object-fit:contain; scroll-snap-align:start}
#desc{ height:35vh; overflow-y:auto; padding:15px; white-space:pre-wrap; border-top: 1px solid var(--border-color); }
#dtitle { padding: 0 15px; margin: 15px 0 5px 0; }

/* 切换多个创作者的下拉菜单样式 */
.author-select-box { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--header-bg); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; font-size: 15px; font-weight: bold; }

/* 作者卡片盒 */
.author-card-box {
    background: var(--header-bg);
    border-radius: 12px;
    padding: 20px 15px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    color: var(--text-color);
}
.author-main { display: flex; align-items: center; gap: 15px; position: relative; }
.author-avatar { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 2px solid #ddd; }
.author-right { display: flex; flex-direction: column; gap: 6px; }
.author-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.author-name { font-size: 20px; font-weight: bold; }
/* Lv修改为自定义头衔 */
.author-title-badge { background: #e2f0e3; color: #52a55d; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
/* A2区域修改为作品浏览（小图片样式） */
.author-work-preview { font-size: 12px; background: rgba(90,169,255,0.15); color: #5aa9ff; border: 1px solid #5aa9ff; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }

.author-stats { display: flex; gap: 20px; margin-top: 12px; padding-left: 90px; }
.stat-item { display: flex; flex-direction: column; align-items: center; font-size: 13px; color: var(--text-color); opacity: 0.8; }
.stat-item .num { font-size: 18px; font-weight: bold; margin-bottom: 2px; opacity: 1; }
.stat-item .num.green { color: #4caf50; }
.author-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px; color: var(--text-color); opacity: 0.6; }
.lollipop-box { display: flex; align-items: center; gap: 4px; color: #e0a13c; font-weight: bold; font-size: 14px; opacity: 1; }

/* 设置界面布局 */
.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color); }
.setting-item span { font-size: 16px; font-weight: bold; }
.setting-item select, .setting-item input[type="checkbox"] { padding: 6px; font-size: 14px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); }
.setting-item input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }

/* 底部跑马灯 */
#marquee{position:fixed; bottom:0; left:0; right:0; background:#000; overflow:hidden; z-index: 5; color: #fff; height: 24px; line-height: 24px; font-size: 13px;}
#marquee div{white-space:nowrap; padding-left:100%; animation:mar 15s linear infinite}
@keyframes mar{to{transform:translateX(-100%)}}
body { padding-bottom: 25px; }
</style>
</head>
<body oncontextmenu="return false">

<header>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tank-page', this)">坦克</button>
        <button class="tab-btn" onclick="switchTab('author-page', this)">作者</button>
        <button class="tab-btn" onclick="switchTab('settings-page', this)">设置</button>
    </div>
    
    <div id="header-filters" class="filter-bar">
        <input id="search" placeholder="搜索坦克名称">
        <select id="nation">
            <option value="">全部国家</option>
            <option value="FR">F系</option>
            <option value="DE">D系</option>
            <option value="US">M系</option>
            <option value="RU">S系</option>
            <option value="CN">C系</option>
            <option value="SE">V系</option>
        </select>
        <select id="tier">
            <option value="">全部等级</option>
            <option>VIII</option><option>IX</option><option>X</option><option>XI</option>
        </select>
        <select id="type">
            <option value="">全部类型</option>
            <option>工程车</option><option>重坦</option><option>中坦</option>
            <option>轻坦</option><option>反坦</option><option>火炮</option>
        </select>
    </div>
</header>

<div id="tank-page" class="page-content active">
    <div id="grid" class="grid-mode"></div>
</div>

<div id="author-page" class="page-content">
    <select id="author-selector" class="author-select-box" onchange="renderAuthorCard(this.value)">
        </select>

    <div id="author-card-container"></div>
</div>

<div id="settings-page" class="page-content">
    <div class="setting-item">
        <span>白天 / 夜晚模式</span>
        <input type="checkbox" id="theme-toggle" onchange="toggleTheme(this.checked)">
    </div>
    <div class="setting-item">
        <span>排布显示模式</span>
        <select id="layout-select" onchange="toggleLayout(this.value)">
            <option value="grid">小图片网格模式</option>
            <option value="list">列表排序模式</option>
        </select>
    </div>
</div>

<div id="detail">
    <div id="back">← 返回列表</div>
    <div id="gallery"></div>
    
    <div id="detail-author-zone"></div>

    <h2 id="dtitle"></h2>
    <div id="desc"></div>
</div>

<div id="marquee"><div>【官方QQ群聊：967845736】　　　【UP：烛梦Cael】</div></div>

<script>
// 【1. 自定义 PNG 透明图标配置】
// 请把你的图标图片命名为对应的名字（例如 ht.png），并放在同目录下。
// 如果没有检测到图片，会自动使用原本的 Emoji 符号保底，防止崩排版。
const typeIcons = {
    "重坦": { png: "ht.png", fallback: "▰" },
    "中坦": { png: "mt.png", fallback: "▱" },
    "轻坦": { png: "lt.png", fallback: "▲" },
    "反坦": { png: "td.png", fallback: "▼" },
    "火炮": { png: "spg.png", fallback: "■" },
    "工程车": { png: "eng.png", fallback: "⚙" }
};

// 【2. 多创作者数据库】
// 如果要加新创作者，直接在下面复制一组即可！
const authors = {
    "cael": {
        name: "烛梦Cael",
        avatar: "avatar.JPG",
        title: "站长",                // 原 Lv 位置改成的头衔
        workText: "🖼️ 作品浏览",     // 原 A2 区域改成的作品浏览标签
        worksCount: 4,               // 作品数
        fansCount: 1,                // 粉丝数
        joinTime: "2026-6-8 20:45:15",
        totalWorks: 67               // 底部作品总数
    },
    "test_author": {
        name: "神秘创作者X",
        avatar: "avatar2.JPG",
        title: "特邀作者",
        workText: "🖼️ 概念图集",
        worksCount: 12,
        fansCount: 99,
        joinTime: "2026-6-9 12:00:00",
        totalWorks: 15
    }
};

// 【3. 坦克数据绑定作者】
// 只需要在坦克里加上 authorId，就能自动和上面的创作者完成绑定！
const tanks=[
{
name:"EBG-62",
nation:"FR",
tier:"VIII",
type:"工程车",
authorId: "cael", // 绑定烛梦Cael
imgs:["EBG-62.JPG"],
text:"这里填写详细介绍。"
},
{
name:"EBG-54",
nation:"FR",
tier:"IX",
type:"工程车",
authorId: "cael",
imgs:["EBG-54.JPG"],
text:"这里填写详细介绍。"
},
{
name:"EBG-58",
nation:"FR",
tier:"X",
type:"工程车",
authorId: "cael",
imgs:["EBG-58.JPG"],
text:"这里填写详细介绍。"
},
{
name:"Ikv 62",
nation:"SE",
tier:"VIII",
type:"中坦",
authorId: "test_author", // 绑定到神秘创作者X
imgs:["IKV-62.JPG"],
text:`历史参考: \nIkv 63是瑞典六十年代研发的中型坦克...`
},
{
name:"EBG-60",
nation:"FR",
tier:"XI",
type:"工程车",
authorId: "cael",
imgs:["EBG-60.JPG"],
text:"这里填写详细介绍。"
}
];

const grid=document.getElementById("grid");
const filters = document.getElementById("header-filters");

// 选项卡切换逻辑
function switchTab(pageId, btn) {
    document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(pageId).classList.add('active');
    btn.classList.add('active');
    
    if(pageId === 'tank-page') {
        filters.style.display = 'grid';
    } else {
        filters.style.display = 'none';
    }
}

// 获取处理后的车型图标HTML（支持PNG透明图与保底Emoji）
function getIconHtml(type) {
    const config = typeIcons[type];
    if (!config) return "•";
    // 这里的 onerror 保证了如果你的本地透明 PNG 图片还没准备好，会自动切回原来的符号
    return `<img src="${config.png}" class="type-icon-png" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'" style="vertical-align:middle;"><span style="display:none;">${config.fallback}</span>`;
}

// 主渲染逻辑
function draw(){
    grid.innerHTML="";
    const currentLayout = document.getElementById("layout-select").value;
    
    tanks.forEach(t=>{
        if((!nation.value||t.nation===nation.value)
        &&(!tier.value||t.tier===tier.value)
        &&(!type.value||t.type===type.value)
        &&t.name.toLowerCase().includes(search.value.toLowerCase())){
            
            let card=document.createElement("div");
            card.className="card "+t.nation;
            
            let iconHtml = getIconHtml(t.type);
            
            if(currentLayout === 'grid') {
                card.innerHTML = `
                    <div class='title-container'>${iconHtml}<span style="margin-left:2px;">${t.name}</span></div>
                    <img class="tank-preview" src='${t.imgs[0]}' onerror="this.src='https://via.placeholder.com/120x80?text=No+Image'">
                `;
            } else {
                card.innerHTML = `
                    <div class='title-container'>
                        ${iconHtml}
                        <span style="margin-left:4px;">${t.name}</span>
                    </div>
                    <span class='type-badge'>${t.tier} / ${t.type}</span>
                `;
            }
            
            card.onclick=()=>showTank(t);
            grid.appendChild(card);
        }
    });
}

// 动态渲染独立作者页里的卡片
function renderAuthorCard(authorKey) {
    const container = document.getElementById("author-card-container");
    const author = authors[authorKey];
    if(!author) return
