<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>坦克墙</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial}
header{position:sticky;top:0;background:#222;padding:10px}
input,select{width:100%;padding:8px;margin:4px 0;box-sizing:border-box}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{border-radius:10px;padding:8px;cursor:pointer}
.FR{background:#244}
.DE{background:#444}
.US{background:#243}
.RU{background:#422}
.CN{background:#664}
.SE{background:linear-gradient(90deg,#146,#db3)}
.card img{width:100%;height:120px;object-fit:contain}
.title{text-align:center;font-weight:bold}
#detail{display:none;position:fixed;inset:0;background:#111}
#back{padding:10px;background:#222}
#gallery{display:flex;overflow-x:auto;scroll-snap-type:x mandatory}
#gallery img{width:100vw;height:45vh;object-fit:contain;scroll-snap-align:start}
#desc{height:30vh;overflow-y:auto;padding:10px}
#marquee{position:fixed;bottom:0;left:0;right:0;background:#000;overflow:hidden}
#marquee div{white-space:nowrap;padding-left:100%;animation:mar 15s linear infinite}
@keyframes mar{to{transform:translateX(-100%)}}
</style>
</head>
<body oncontextmenu="return false">
<header>
<input id="search" placeholder="搜索坦克名称">
<select id="nation">
<option value="">全部国家</option>
<option value="FR">F系</option>
<option value="DE">D系</option>
<option value="US">M系</option>
<option value="RU">S系</option>
<option value="CN">C系</option>
<option value="SE">V系</option>
</select>
<select id="tier">
<option value="">全部等级</option>
<option>VIII</option><option>IX</option><option>X</option><option>XI</option>
</select>
<select id="type">
<option value="">全部类型</option>
<option>工程车</option><option>重坦</option><option>中坦</option>
<option>轻坦</option><option>反坦</option><option>火炮</option>
</select>
</header>

<div id="grid"></div>

<div id="detail">
<div id="back">← 返回</div>
<div id="gallery"></div>
<h2 id="dtitle"></h2>
<div id="desc"></div>
</div>

<div id="marquee"><div>【官方QQ群聊：967845736】　　　【UP：烛梦Cael】</div></div>

<script>
const tanks=[
{
name:"EBG-62",
nation:"FR",
tier:"VIII",
type:"工程车",
imgs:["EBG-62.JPG"],
text:"这里填写详细介绍。"
},
{
name:"EBG-54",
nation:"FR",
tier:"IX",
type:"工程车",
imgs:["EBG-54.JPG"],
text:"这里填写详细介绍。"
},
{
name:"EBG-58",
nation:"FR",
tier:"X",
type:"工程车",
imgs:["EBG-58.JPG"],
text:"这里填写详细介绍。"
},
{
name:"Ikv 62",
nation:"SE",
tier:"VIII",
type:"中坦",
imgs:["IKV-62.JPG"],
text:"这里填写详细介绍。"
},
{
name:"EBG-60",
nation:"FR",
tier:"XI",
type:"工程车",
imgs:["EBG-60.JPG"],
text:"这里填写详细介绍。"
}
];

const grid=document.getElementById("grid");

function draw(){
grid.innerHTML="";
tanks.forEach(t=>{
if((!nation.value||t.nation===nation.value)
&&(!tier.value||t.tier===tier.value)
&&(!type.value||t.type===type.value)
&&t.name.toLowerCase().includes(search.value.toLowerCase())){
let card=document.createElement("div");
card.className="card "+t.nation;
card.innerHTML="<div class='title'>"+t.name+"</div><img src='"+t.imgs[0]+"'>";
card.onclick=()=>showTank(t);
grid.appendChild(card);
}
});
}

function showTank(t){
detail.style.display="block";
dtitle.innerText=t.name;
desc.innerText=t.text;
gallery.innerHTML="";
t.imgs.forEach(i=>{
gallery.innerHTML+="<img src='"+i+"'>";
});
}

back.onclick=()=>detail.style.display="none";
search.oninput=draw;
nation.onchange=draw;
tier.onchange=draw;
type.onchange=draw;
draw();
</script>
</body>
</html>
