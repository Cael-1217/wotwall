<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>坦克墙</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial;user-select:none;-webkit-user-select:none}img{-webkit-user-drag:none;pointer-events:none}#top{position:sticky;top:0;background:#222;padding:8px}input,select{width:100%;padding:8px;margin:4px 0}#grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}.card{padding:6px;border-radius:8px}.FR{background:#1d4e89}.DE{background:#555}.US{background:#2f6b3d}.CN{background:#8a6d1d}.RU{background:#7a2222}.SE{background:#2a4f9b}.UK{background:#5b3a7a}.JP{background:#7a3a4a}.IT{background:#2d6a4f}.CZ{background:#2d7a7a}.PL{background:#7a4a2d}.card img{width:100%;height:120px;object-fit:contain}.title{text-align:center;font-weight:bold}#detail{display:none;position:fixed;inset:0;background:#111}#viewer{display:flex;transition:.3s}.pic{min-width:100vw;height:45vh;display:flex;align-items:center;justify-content:center}.pic img{max-width:100%;max-height:100%}#text{height:32vh;overflow:auto;padding:10px}#foot{position:fixed;bottom:0;left:0;right:0;background:#000;height:28px;overflow:hidden}#mar{display:inline-block;white-space:nowrap;padding-left:100%;animation:m 15s linear infinite}@keyframes m{to{transform:translateX(-100%)}}</style></head><body oncontextmenu="return false"><div id="top"><input id="s" placeholder="搜索坦克"><select id="f"><option value="">全部国家</option><option>FR</option><option>DE</option><option>US</option><option>CN</option><option>RU</option><option>SE</option><option>DE</option><option>UK</option><option>JP</option><option>IT</option><option>CZ</option><option>PL</option></select>
<select id="tier"><option value="">全部等级</option><option>VIII</option><option>IX</option><option>X</option><option>XI</option></select>
<select id="type"><option value="">全部类型</option><option>工程车</option><option>重坦</option><option>中坦</option><option>轻坦</option><option>反坦</option><option>火炮</option></select></div><div id="grid"></div><div id="detail"><button onclick="detail.style.display='none'">返回</button><div id="viewer"></div><h2 id="tit"></h2><div id="text"></div></div><div id="foot"><div id="mar">【官方QQ群聊：967845736】    【UP：烛梦Cael】</div></div><script>
let ac=new(window.AudioContext||webkitAudioContext)();
function beep(){let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.05);o.stop(ac.currentTime+.05);}
const tanks=[{name:'EBG-62',nation:'FR',imgs:['EBG-62.JPG'],tier:'VIII',type:'工程车',text:'F系VIII级工程车EBG-62'},{name:'EBG-54',nation:'FR',imgs:['EBG-54.JPG'],tier:'IX',type:'工程车',text:'F系IX级工程车EBG-54'},{name:'EBG-58',nation:'FR',imgs:['EBG-58.JPG'],tier:'X',type:'工程车',text:'F系X级工程车EBG-58'},{name:'EBG-60',nation:'FR',imgs:['EBG-60.JPG'],tier:'XI',type:'工程车',text:'F系XI级工程车EBG-60'}];
function draw(){grid.innerHTML='';tanks.forEach(x=>{if((!f.value||x.nation==f.value)&&(!tier.value||x.tier==tier.value)&&(!type.value||x.type==type.value)&&x.name.toLowerCase().includes(s.value.toLowerCase())){let d=document.createElement('div');d.className='card '+x.nation;d.innerHTML='<div class=title>'+x.name+'</div><img src='+x.imgs[0]+'>';d.onclick=()=>openT(x);grid.appendChild(d)}})}
function openT(x){beep();detail.style.display='block';tit.innerText=x.name;text.innerText=x.text;viewer.innerHTML='';x.imgs.forEach(i=>viewer.innerHTML+='<div class=pic><img src='+i+'></div>');let p=0,st=0;viewer.style.transform='translateX(0)';detail.ontouchstart=e=>st=e.touches[0].clientX;detail.ontouchend=e=>{let d=e.changedTouches[0].clientX-st;if(d<-50&&p<x.imgs.length-1)p++;if(d>50&&p>0)p--;viewer.style.transform='translateX('+(-p*100)+'vw)';}}
s.oninput=draw;f.onchange=draw;tier.onchange=draw;type.onchange=draw;draw();
</script></body></html>
